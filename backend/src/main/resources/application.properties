# Server configuration (binds to cloud host $PORT or defaults to 8080 locally)
server.port=${PORT:8080}

# Application configuration
spring.application.name=tictactoe-backend

# Disable banner for cleaner startup logs
spring.main.banner-mode=off

# Datasource configuration
# Defaults to in-memory H2 with PostgreSQL compatibility mode for zero-configuration local runs and testing.
# In production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tictactoedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Enable H2 console for local development inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Static resource cache control (disable cache so deployments update instantly)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
